name: Build & Upload
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ENVS:
        required: false
      DOCKER_PY_REVANCED_SECRETS:
        required: false
      REDDIT_CLIENT_ID:
        required: false
      PERSONAL_ACCESS_TOKEN:
        required: false
    inputs:
      CI_TEST:
        required: false
        type: boolean
        default: false
      COMMIT_CHANGELOG:
        type: boolean
        required: false
        default: true
      DEBUG_ENABLED:
        type: boolean
        description: 'Run the build with tmate debugging enabled.'
        required: false
        default: false
      PREFERRED_PATCH_APPS:
        description: "Apps to be patched. Overrides any env set"
        required: false
        type: string
      RELEASE_TAG:
        description: "GitHub release tag this build will be uploaded under. Used as the Obtainium export tag."
        required: false
        type: string

jobs:
  build-apk:
    permissions: write-all
    name: APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update Env for custom build
        env:
          # Pass ENVS as step env var rather than inline string interpolation to prevent shell syntax issues if secret contains special characters.
          ENVS: ${{ secrets.ENVS }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ inputs.RELEASE_TAG }}
        run: |
          # Safely append ENVS secret to .env using printf to prevent shell interpolation parsing errors.
          printf '%s\n' "$ENVS" >> .env
          echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .env
          # An ENVS-embedded PERSONAL_ACCESS_TOKEN always wins (backwards compat); only fall back to secret when unset/empty.
          # We filter out empty assignments (grep -v '^$') to ensure a trailing empty declaration doesn't hide a valid token set earlier in ENVS.
          existing_pat=$(grep -E '^[[:space:]]*PERSONAL_ACCESS_TOKEN[[:space:]]*=' .env | cut -d'=' -f2- | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e "s/^['\"]//" -e "s/['\"]$//" | grep -v '^$' | tail -n1 || true)
          if [ -n "${PERSONAL_ACCESS_TOKEN}" ] && [ -z "${existing_pat}" ]; then
            printf 'PERSONAL_ACCESS_TOKEN=%s\n' "${PERSONAL_ACCESS_TOKEN}" >> .env
          fi
          # Only fill in OBTAINIUM_GITHUB_TAG when caller did not pin a non-empty value in ENVS.
          existing_tag=$(grep -E '^[[:space:]]*OBTAINIUM_GITHUB_TAG[[:space:]]*=' .env | cut -d'=' -f2- | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e "s/^['\"]//" -e "s/['\"]$//" | grep -v '^$' | tail -n1 || true)
          if [ -n "${RELEASE_TAG}" ] && [ -z "${existing_tag}" ]; then
            printf 'OBTAINIUM_GITHUB_TAG=%s\n' "${RELEASE_TAG}" >> .env
          fi

      - name: Update Env from secrets for custom build
        run: |
          echo "${{ secrets.DOCKER_PY_REVANCED_SECRETS }}" >> .env
          echo "Added envs"

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install Requirements
        if: ${{ inputs.PREFERRED_PATCH_APPS }}
        env:
          PREFERRED_PATCH_APPS: ${{ inputs.PREFERRED_PATCH_APPS }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Override Patch apps
        if: ${{ inputs.PREFERRED_PATCH_APPS }}
        env:
          PREFERRED_PATCH_APPS: ${{ inputs.PREFERRED_PATCH_APPS }}
        run: |
          python -m scripts.prefered_apps

      - name: Inject Reddit Client ID
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        if: env.REDDIT_CLIENT_ID != null
        run: |
          client_id="${REDDIT_CLIENT_ID}"
          path="apks/options.json"
          json_data=$(cat "${path}")

          new_object='{
          "patchName": "Spoof client",
          "options": [
            {
              "key": "Application client ID",
              "value": "'${client_id}'"
            }
          ]
          }'
          # ReVanced v6 exposes the option name as the key because its list-patches output has no explicit Key field.
          existing_object_index=$(echo "${json_data}" | jq 'map(.patchName) | index("Spoof client")')
          echo "${existing_object_index}"
          if [[ ${existing_object_index} != "null" ]]; then
            echo "Patch entry already exists. Overriding client ID in it."
            updated_json=$(echo "${json_data}" | jq ".[${existing_object_index}].options[0].value = \"${client_id}\"")
          else
            echo "Patch entry doesn't exists. Adding new entry."
            updated_json=$(echo "${json_data}" | jq ". += [${new_object}]")
          fi
          echo "${updated_json}" > "${path}"


      - name: Setup tmate session
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.DEBUG_ENABLED }}
        with:
          detached: true

      - name: Build Revanced APKs
        if: ${{ true && !inputs.DEBUG_ENABLED }}
        run: |
          if [[ "${{ inputs.CI_TEST }}" =~ ^(true|True|1)$ ]]; then
              echo "In CI Testing. Using local compose file."
              docker compose -f docker-compose-local.yml up --build
          else
              echo "Using Prod compose file."
              docker compose up --build
          fi

      - name: Verify at least one APK was patched
        if: ${{ true && !inputs.DEBUG_ENABLED }}
        run: |
          # Count patched APKs (excluding Microg which is a dependency, not a patched app)
          patched_count=$(find apks -maxdepth 1 -name "*-output.apk" ! -name "Revanced-Microg-output.apk" -type f 2>/dev/null | wc -l)
          echo "Found $patched_count patched APK(s)"

          if [ "$patched_count" -eq 0 ]; then
            echo "::error::No APKs were successfully patched. Build failed."
            exit 1
          fi

          echo "✅ Successfully patched $patched_count APK(s):"
          find apks -maxdepth 1 -name "*-output.apk" ! -name "Revanced-Microg-output.apk" -type f

      - name: Ensure changelog files exist
        if: ${{ true && !inputs.DEBUG_ENABLED }}
        run: |
          # Create empty changelog files if they don't exist (fallback for failed builds)
          if [ ! -f changelog.md ]; then
            echo "| Resource Name | Version | Changelog | Published On | Build By|" > changelog.md
            echo "|---------------|---------|-----------|--------------|---------|" >> changelog.md
          fi
          if [ ! -f changelog.json ]; then
            echo "{}" > changelog.json
          fi
          if [ ! -f updates.json ]; then
            echo "{}" > updates.json
          fi

      - name: Upload Build APKS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ true && !inputs.DEBUG_ENABLED }}
        with:
          name: Built-APKs
          path: |
            changelog.md
            changelog.json
            updates.json
            apks/*-output.apk
            apks/VancedMicroG.apk
          if-no-files-found: error

      - name: Select changelog files
        id: changelog_files
        if: ${{ inputs.COMMIT_CHANGELOG && !inputs.CI_TEST}}
        run: |
          # Add the optional site index only when generated so git never receives a missing pathspec.
          file_pattern='changelog.md changelog.json updates.json obtainium_sources/*'
          if [ -f index.html ]; then
            file_pattern="${file_pattern} index.html"
          fi
          echo "file_pattern=${file_pattern}" >> "$GITHUB_OUTPUT"

      - name: Commit Update file
        if: ${{ inputs.COMMIT_CHANGELOG && !inputs.CI_TEST}}
        uses: stefanzweifel/git-auto-commit-action@master
        with:
          branch: changelogs
          skip_checkout: true
          file_pattern: ${{ steps.changelog_files.outputs.file_pattern }}
          commit_message: 🚀New Build
          push_options: '--force'
